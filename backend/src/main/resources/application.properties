spring.application.name=electromarket

# Perfil activo: activa application-local.properties si existe
spring.profiles.active=local

# Configuracion de conexion a PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/electromarket
spring.datasource.username=postgres

# JPA / Hibernate
# validate: Hibernate solo verifica que las entidades coincidan con las tablas de la BD, no crea ni borra nada
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
